<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221B16" media="(prefers-color-scheme: dark)">
<meta name="description" content="Family meal planner with shopping lists and an AI chef.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Meal Planner</title>
<style>
/* ── TOKENS ── */
:root{
  --bg:#FBF6EF; --sf:#FFFFFF; --sf2:#F7F0E7; --bd:#EADFD0; --bd2:#DED0BD;
  --t1:#1F1812; --t2:#5E5045; --t3:#8F8174;
  --pr:#C4622D; --acc:#B4561F; --pr-s:#F8E6DA;
  --gn:#2C5F2E; --gn-t:#2C5F2E; --gn-s:#E3EEE3;
  --am:#D4900A; --am-t:#A86F00; --am-s:#FCF0D6;
  --danger:#B83A2B; --danger-s:#FBE5E1;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 14px rgba(60,40,20,.06);
  --shadow-lg:0 18px 50px rgba(40,25,10,.22);
  --r:18px; --r-sm:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16110D; --sf:#221B16; --sf2:#2A221C; --bd:#3A2F27; --bd2:#4A3D33;
    --t1:#F5EDE4; --t2:#D2C4B7; --t3:#9C8E81;
    --acc:#EE8C55; --pr-s:#3D2618;
    --gn-t:#7DBB80; --gn-s:#1F2F20;
    --am-t:#EDB54B; --am-s:#3A2C12;
    --danger:#F07A6A; --danger-s:#3A1D19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}

/* ── BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
img{max-width:100%}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── APP SHELL: phone = top / content / bottom nav; tablet = side rail ── */
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "nav";height:100vh;height:100dvh}
#topbar{grid-area:top;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px;background:var(--sf);border-bottom:1px solid var(--bd);z-index:10}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand img{width:42px;height:42px;border-radius:12px;flex-shrink:0;box-shadow:var(--shadow)}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.2px;line-height:1.15}
.brand-sub{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scroller{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#nav{grid-area:nav;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:var(--safe-b);z-index:10}
.nbt{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--t3)}
.nbt .pill{width:58px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.nbt.on{color:var(--acc)}
.nbt.on .pill{background:var(--pr-s)}
@media (min-width:768px){
  #app{grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"nav top" "nav main"}
  #nav{flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(var(--safe-t) + 84px) 0 16px;border-top:none;border-right:1px solid var(--bd)}
  .nbt{flex:0 0 auto;height:76px}
  #topbar{padding-left:24px;padding-right:24px}
}

/* ── COMMON ── */
.view{display:none;padding:18px 16px 32px;max-width:1240px;margin:0 auto;animation:fadeIn .2s ease}
.view.on{display:block}
.view.narrow{max-width:780px}
@media (min-width:768px){.view{padding:28px 32px 40px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.h1{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.sub{font-size:13.5px;color:var(--t3);margin-top:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow)}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--bd);background:var(--sf);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--sf2)}
.icon-btn.sm{width:36px;height:36px;border-radius:11px}
.icon-btn.sm svg.i{width:18px;height:18px}
.icon-btn.ghost{border-color:transparent;background:transparent;color:var(--t3)}
.icon-btn.danger{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15.5px;transition:transform .1s,opacity .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 15px;font-size:14px;border-radius:12px}
.btn-pr{background:var(--pr);color:#fff}
.btn-gn{background:var(--gn);color:#fff}
.btn-soft{background:var(--pr-s);color:var(--acc)}
.btn-ghost{background:transparent;border:1.5px solid var(--bd2);color:var(--t2)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin:0 0 7px}
.inp{display:block;width:100%;min-height:50px;padding:0 15px;border:1.5px solid var(--bd);border-radius:13px;background:var(--sf);color:var(--t1);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-s)}
.inp::placeholder{color:var(--t3)}
.field{margin-bottom:16px}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.mchip{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;object-fit:cover}
.mchip svg.i{width:16px;height:16px}
.mchip-breakfast{background:var(--am-s);color:var(--am-t)}
.mchip-lunch{background:var(--pr-s);color:var(--acc)}
.mchip-dinner{background:var(--gn-s);color:var(--gn-t)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag svg.i{width:12px;height:12px}
.tag-today{background:var(--pr);color:#fff}
.tag-quick{background:var(--am-s);color:var(--am-t)}
#js-banner{background:#B83A2B;color:#fff;padding:12px 16px;font-size:13px;font-weight:700;text-align:center}
#err-banner{background:#D4900A;color:#fff;padding:10px 16px;font-size:12px;word-break:break-word}

/* ── WEEK ── */
.wk-ctrl{display:flex;align-items:center;gap:8px}
.wk-today{min-height:42px;padding:0 14px;border-radius:13px;border:1px solid var(--bd);background:var(--sf);font-weight:700;font-size:14px;color:var(--acc)}
.week-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:620px){.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.week-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1380px){.week-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.daycard{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.daycard:active{transform:scale(.99)}
@media (hover:hover){.daycard:hover{box-shadow:0 2px 4px rgba(60,40,20,.06),0 10px 26px rgba(60,40,20,.1)}}
.daycard.today{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr),var(--shadow)}
.daycard.quick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--am)}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.dc-title{display:block;min-width:0}
.dc-name{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px}
.dc-date{display:block;font-size:12.5px;color:var(--t3);margin-top:1px}
.dc-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dc-meal{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14.5px;min-width:0}
.dc-mname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1);font-weight:500}
.dc-mname.empty{color:var(--t3);font-style:italic;font-weight:400}

/* ── SHEETS: bottom sheet on phones, centred dialog on tablets ── */
#overlay{position:fixed;inset:0;background:rgba(25,16,8,.42);z-index:50;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#overlay.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;background:var(--sf);border-radius:24px 24px 0 0;z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;padding-bottom:var(--safe-b)}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#mealSheet,#menuSheet{z-index:70}
#confirmSheet{z-index:80}
.handle{width:40px;height:5px;background:var(--bd2);border-radius:3px;margin:10px auto 4px;flex-shrink:0}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 20px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sh-title{font-size:21px;font-weight:800;letter-spacing:-.3px}
.sh-sub{font-size:13px;color:var(--t3);margin-top:2px}
.sh-body{overflow-y:auto;flex:1;padding:18px 20px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{padding:12px 20px 16px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--sf)}
@media (min-width:768px){
  .sheet{top:50%;left:50%;right:auto;bottom:auto;width:min(580px,calc(100vw - 64px));max-height:86vh;border-radius:24px;padding-bottom:0;transform:translate(-50%,-47%) scale(.97);opacity:0;transition:transform .22s ease,opacity .22s ease,visibility 0s .22s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;transition:transform .22s ease,opacity .22s ease}
  .sheet .handle{display:none}
  .sh-head{padding-top:20px}
  #confirmSheet{width:min(440px,calc(100vw - 64px))}
}

/* Day sheet */
.qt-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--sf2);border:1px solid var(--bd);border-radius:14px;margin-bottom:16px}
.qt-ico{width:36px;height:36px;border-radius:11px;background:var(--am-s);color:var(--am-t);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qt-text{flex:1;min-width:0}
.qt-title{display:block;font-weight:700;font-size:15px}
.qt-hint{display:block;font-size:12.5px;color:var(--t3)}
.trk{width:48px;height:28px;background:var(--bd2);border-radius:14px;position:relative;transition:background .2s;flex-shrink:0}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.qt-row[aria-checked="true"] .trk{background:var(--am)}
.qt-row[aria-checked="true"] .trk::after{transform:translateX(20px)}
.slot{border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;overflow:hidden;background:var(--sf)}
.slot-head{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;min-height:58px}
.slot-type{flex:1;font-weight:700;font-size:15px}
.slot-acts{display:flex;gap:6px}
.slot-add{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:12px;background:var(--pr);color:#fff;font-weight:700;font-size:14px}
.slot-add svg.i{width:17px;height:17px}
.slot-body{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:4px 14px 14px}
.slot-thumb{width:56px;height:56px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--sf2);color:var(--t3);display:flex;align-items:center;justify-content:center}
.slot-info{flex:1;min-width:0}
.slot-name{display:block;font-weight:700;font-size:16px}
.slot-note{display:block;font-size:13px;color:var(--t3);margin-top:2px}

/* Meal editor */
.pzone{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:170px;border:2px dashed var(--bd2);border-radius:16px;background:var(--sf2);overflow:hidden;color:var(--t3)}
.pzone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pzone-ph{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;padding:0 16px;text-align:center}
.pzone-ph svg.i{width:30px;height:30px}

/* Menu */
.menu-group{display:grid;gap:8px;margin-bottom:8px}
.menu-item{display:flex;align-items:center;gap:13px;width:100%;min-height:54px;padding:0 16px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);font-weight:600;font-size:15px;text-align:left}
.menu-item svg.i{color:var(--acc)}
.menu-item:active{background:var(--sf2)}
.msec{border-top:1px solid var(--bd);padding-top:18px;margin-top:18px}
.msec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.msec-title svg.i{width:17px;height:17px;color:var(--acc)}
.msec-hint{font-size:13px;color:var(--t3);margin-bottom:12px;line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--sf2);padding:5px;border-radius:14px;border:1px solid var(--bd)}
.seg button{min-height:42px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--t2)}
.seg button.on{background:var(--sf);color:var(--acc);box-shadow:var(--shadow)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pin-inp{letter-spacing:6px;text-align:center}
.pin-inp::placeholder{letter-spacing:normal}
.status{font-size:13px;margin-top:8px;text-align:center;color:var(--t3);min-height:18px}
.status.ok{color:var(--gn-t)}
.status.err{color:var(--danger)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.menu-foot{text-align:center;font-size:12px;color:var(--t3);margin-top:22px}

/* Confirm */
.cf{padding-top:20px}
.cf p{color:var(--t2);margin:8px 0 20px;line-height:1.5}
.cf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── SHOPPING ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);font-weight:700;font-size:14px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.chip-count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pr-s);color:var(--acc);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}
.chip.on .chip-count{background:rgba(255,255,255,.25);color:#fff}
.add-row{display:flex;gap:8px;margin-bottom:14px}
.add-row .btn{min-width:50px;padding:0}
.list-card{overflow:hidden}
.sitem{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--bd);min-height:56px}
.sitem:last-child{border-bottom:none}
.schk{width:26px;height:26px;border:2px solid var(--bd2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;transition:background .15s,border-color .15s}
.schk svg.i{width:16px;height:16px;stroke-width:3}
.sitem.done .schk{background:var(--gn);border-color:var(--gn)}
.snm{flex:1;min-width:0;font-size:15.5px;cursor:pointer;word-break:break-word}
.sitem.done .snm{text-decoration:line-through;color:var(--t3)}
.empty{text-align:center;padding:26px 20px 30px}
.empty-chef{width:84px;height:auto;margin-bottom:8px}
.empty-title{font-weight:800;font-size:17px;margin-bottom:4px}
.empty-text{color:var(--t3);font-size:14px;max-width:340px;margin:0 auto;line-height:1.5}

/* ── AI CHEF ── */
.hero{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:16px;background:linear-gradient(135deg,var(--pr-s),var(--sf) 70%)}
.hero img{width:88px;height:auto;flex-shrink:0}
.hero p{color:var(--t2);font-size:14.5px;margin-top:4px;line-height:1.5}
.ai-card{padding:20px;margin-bottom:16px}
.ai-card h2{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;margin-bottom:6px}
.ai-card h2 svg.i{color:var(--acc)}
.ai-card > p{font-size:14px;color:var(--t2);line-height:1.5;margin-bottom:16px}
.sug{border-top:1px solid var(--bd);margin-top:18px;padding-top:16px}
.sug-head{font-weight:800;font-size:12.5px;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.sug-day{padding:10px 0;border-bottom:1px solid var(--bd)}
.sug-day:last-of-type{border-bottom:none}
.sug-name{font-weight:800;font-size:15px;margin-bottom:6px}
.sug-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t2);padding:2px 0}
.sug-line .mchip{width:24px;height:24px;border-radius:8px}
.sug-line .mchip svg.i{width:13px;height:13px}
.id-res{margin-top:14px;padding:14px 16px;background:var(--gn-s);border-radius:14px}
.id-res-name{font-weight:800;font-size:16px;color:var(--gn-t)}
.id-res-desc{font-size:14px;color:var(--t2);margin-top:3px;line-height:1.5}
@media (min-width:1080px){
  #v-ai.view{max-width:1240px}
  .ai-cols{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
}

/* ── LOCK SCREEN ── */
#pinScreen{position:fixed;inset:0;z-index:500;background:radial-gradient(120% 70% at 50% 0%,var(--pr-s),var(--bg) 60%);overflow-y:auto;display:flex}
.lock-inner{margin:auto;display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);width:100%;max-width:420px}
.lock-chef{height:clamp(120px,26vh,210px);width:auto;margin-bottom:10px;animation:bob 3s ease-in-out infinite}
.lock-title{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--t1)}
.lock-fam{font-size:15px;font-weight:700;color:var(--acc);margin-bottom:22px}
.lock-label{font-size:14px;color:var(--t2);font-weight:600;margin-bottom:14px}
.pin-dots{display:flex;gap:14px;margin-bottom:10px}
.pin-dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--bd2);background:var(--sf);transition:background .15s,border-color .15s}
.pin-dots span.on{background:var(--pr);border-color:var(--pr)}
.pin-dots.shake{animation:shake .4s}
.pin-err{font-size:13px;color:var(--danger);font-weight:700;min-height:20px;margin-bottom:10px}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pin-key{width:74px;height:74px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);font-size:25px;font-weight:600;color:var(--t1);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:background .1s,transform .1s}
.pin-key:active{background:var(--sf2);transform:scale(.95)}
.pin-key.ok{background:var(--gn);border-color:var(--gn);color:#fff;font-size:18px;font-weight:800}
.lock-foot{margin-top:26px;font-size:12px;color:var(--t3)}
@media (max-height:560px){.lock-chef{display:none}.lock-fam{margin-bottom:12px}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ── BUSY (thinking chef) & CELEBRATE (happy chef) ── */
.overlay-center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.overlay-center.on{opacity:1;visibility:visible;transition:opacity .25s}
#busy{z-index:90;background:rgba(25,16,8,.45)}
#celebrate{z-index:95;pointer-events:none}
#celebrate.on{pointer-events:auto}
.pop-card{background:var(--sf);border-radius:26px;padding:24px 28px 26px;text-align:center;box-shadow:var(--shadow-lg);max-width:320px;width:100%;transform:scale(.9);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.overlay-center.on .pop-card{transform:scale(1)}
.chef-wrap{position:relative;width:140px;margin:0 auto 12px}
.chef-wrap img{display:block;width:100%;height:auto;animation:bob 2.4s ease-in-out infinite}
.spark{position:absolute;color:var(--am);animation:twinkle 1.6s ease-in-out infinite}
.spark.s1{top:0;right:6%;width:22px;height:22px}
.spark.s2{top:16%;right:-12%;width:15px;height:15px;animation-delay:.5s}
.spark.s3{top:-6%;right:30%;width:13px;height:13px;animation-delay:1s}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
.pop-text{font-weight:800;font-size:17px;line-height:1.35}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--pr);animation:dot 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* ── TOAST ── */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%) translateY(12px);background:#2A211B;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:999;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:768px){#toast{bottom:28px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div style="min-width:0">
        <div class="brand-name">Meal Planner</div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <button class="icon-btn" id="btnMenu" type="button" data-i18n-aria="menu" aria-label="Menu"><svg class="i"><use href="#i-more"/></svg></button>
  </header>

  <nav id="nav">
    <button class="nbt on" id="t-week" type="button"><span class="pill"><svg class="i"><use href="#i-calendar"/></svg></span><span data-i18n="navWeek">Week</span></button>
    <button class="nbt" id="t-shop" type="button"><span class="pill"><svg class="i"><use href="#i-cart"/></svg></span><span data-i18n="navShop">Shopping</span></button>
    <button class="nbt" id="t-ai" type="button"><span class="pill"><svg class="i"><use href="#i-sparkles"/></svg></span><span data-i18n="navAi">AI Chef</span></button>
  </nav>

  <main id="scroller">
    <div id="js-banner">JavaScript is not running — open the app in Brave or Chrome, not in the Google Drive viewer.</div>
    <div id="err-banner" hidden></div>

    <!-- WEEK -->
    <section class="view on" id="v-week">
      <div class="view-head">
        <div>
          <h1 class="h1" id="wkTitle"></h1>
          <div class="sub" id="wkRange"></div>
        </div>
        <div class="wk-ctrl">
          <button class="icon-btn" id="btnPrevWk" type="button" data-i18n-aria="prevWeek"><svg class="i"><use href="#i-left"/></svg></button>
          <button class="wk-today" id="btnToday" type="button" data-i18n="thisWeek">This week</button>
          <button class="icon-btn" id="btnNextWk" type="button" data-i18n-aria="nextWeek"><svg class="i"><use href="#i-right"/></svg></button>
        </div>
      </div>
      <div class="week-grid" id="weekgrid"></div>
    </section>

    <!-- SHOPPING -->
    <section class="view narrow" id="v-shop">
      <div class="view-head">
        <div>
          <h1 class="h1" data-i18n="shopTitle">Shopping list</h1>
          <div class="sub" id="shopProg"></div>
        </div>
        <button class="btn btn-soft btn-sm" id="btnAiShop" type="button"><svg class="i"><use href="#i-sparkles"/></svg><span data-i18n="aiList">AI list</span></button>
      </div>
      <div class="chips" id="storeRow"></div>
      <div class="add-row">
        <input class="inp" id="shopInp" data-i18n-ph="addItemPh" placeholder="Add an item…" enterkeyhint="done" autocomplete="off">
        <button class="btn btn-pr" id="btnAddItem" type="button" data-i18n-aria="addItem"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <div class="card list-card" id="shopList"></div>
    </section>

    <!-- AI CHEF -->
    <section class="view narrow" id="v-ai">
      <div class="card hero">
        <img src="img/chef-main-256.webp" alt="">
        <div>
          <h1 class="h1" data-i18n="aiHeroTitle">Your AI chef</h1>
          <p data-i18n="aiHeroText"></p>
        </div>
      </div>
      <div class="ai-cols">
        <div class="card ai-card">
          <h2><svg class="i"><use href="#i-calendar"/></svg><span data-i18n="planTitle">Plan this week</span></h2>
          <p data-i18n="planDesc"></p>
          <button class="btn btn-pr btn-block" id="planBtn" type="button"><svg class="i"><use href="#i-sparkles"/></svg><span data-i18n="planBtn">Suggest meals</span></button>
          <div id="planRes"></div>
        </div>
        <div class="card ai-card">
          <h2><svg class="i"><use href="#i-camera"/></svg><span data-i18n="idTitle">Identify a meal</span></h2>
          <p data-i18n="idDesc"></p>
          <button class="pzone" id="aiPZ" type="button">
            <img id="aiPhPrev" alt="" hidden>
            <span class="pzone-ph" id="aiPhPH"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="photoTap">Tap to take or choose a photo</span></span>
          </button>
          <input type="file" id="aiPhInp" accept="image/*" hidden>
          <button class="btn btn-gn btn-block" id="idBtn" type="button" disabled style="margin-top:14px"><svg class="i"><use href="#i-search"/></svg><span data-i18n="idBtn">Identify this meal</span></button>
          <div class="id-res" id="idRes" hidden>
            <div class="id-res-name" id="idName"></div>
            <div class="id-res-desc" id="idDesc"></div>
            <button class="btn btn-pr btn-block" id="btnIdShop" type="button" style="margin-top:14px"><svg class="i"><use href="#i-cart"/></svg><span data-i18n="addIngredients">Add ingredients to shopping list</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="overlay"></div>

<!-- DAY SHEET -->
<div class="sheet" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="dsTitle">
  <div class="handle"></div>
  <div class="sh-head">
    <div>
      <div class="sh-title" id="dsTitle"></div>
      <div class="sh-sub" id="dsSub"></div>
    </div>
    <button class="icon-btn" id="btnCloseDay" type="button" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="sh-body">
    <button class="qt-row" id="qtRow" type="button" role="switch" aria-checked="false">
      <span class="qt-ico"><svg class="i"><use href="#i-bolt"/></svg></span>
      <span class="qt-text"><span class="qt-title" data-i18n="quickDay">Quick meal day</span><span class="qt-hint" data-i18n="quickDayHint"></span></span>
      <span class="trk"></span>
    </button>
    <div id="daySlots"></div>
  </div>
</div>

<!-- MEAL EDITOR -->
<div class="sheet" id="mealSheet" role="dialog" aria-modal="true" aria-labelledby="msTitle">
  <div class="handle"></div>
  <div class="sh-head">
    <div class="sh-title" id="msTitle"></div>
    <button class="icon-btn" id="btnCloseMeal" type="button" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="sh-body">
    <div class="field">
      <label class="lbl" for="mName" data-i18n="mealName">Meal name</label>
      <input class="inp" id="mName" data-i18n-ph="mealNamePh" autocomplete="off" enterkeyhint="done">
    </div>
    <div class="field">
      <div class="lbl" data-i18n="photoOpt">Photo (optional)</div>
      <button class="pzone" id="mPZ" type="button">
        <img id="mPhPrev" alt="" hidden>
        <span class="pzone-ph" id="mPhPH"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="photoTap">Tap to take or choose a photo</span></span>
      </button>
      <input type="file" id="mPhInp" accept="image/*" hidden>
      <button class="btn btn-soft btn-block" id="aiIdBtn" type="button" disabled style="margin-top:10px"><svg class="i"><use href="#i-sparkles"/></svg><span data-i18n="aiIdentify">Identify with AI</span></button>
    </div>
    <div class="field">
      <label class="lbl" for="mNotes" data-i18n="notesOpt">Notes (optional)</label>
      <input class="inp" id="mNotes" data-i18n-ph="notesPh" autocomplete="off" enterkeyhint="done">
    </div>
  </div>
  <div class="sh-foot">
    <button class="btn btn-gn btn-block" id="btnSaveMeal" type="button"><svg class="i"><use href="#i-check"/></svg><span data-i18n="saveMeal">Save meal</span></button>
  </div>
</div>

<!-- MENU -->
<div class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="handle"></div>
  <div class="sh-head">
    <div class="sh-title" id="menuTitle" data-i18n="menu">Menu</div>
    <button class="icon-btn" id="btnCloseMenu" type="button" data-i18n-aria="close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="sh-body">
    <div class="menu-group">
      <button class="menu-item" id="btnReport" type="button"><svg class="i"><use href="#i-report"/></svg><span data-i18n="menuReport">Download analysis report</span></button>
      <button class="menu-item" id="btnExport" type="button"><svg class="i"><use href="#i-download"/></svg><span data-i18n="menuExport">Export data (backup)</span></button>
      <button class="menu-item" id="btnImportTrigger" type="button"><svg class="i"><use href="#i-upload"/></svg><span data-i18n="menuImport">Import data</span></button>
      <input type="file" id="importInp" accept=".json,application/json" hidden>
    </div>

    <section class="msec">
      <h3 class="msec-title"><svg class="i"><use href="#i-globe"/></svg><span data-i18n="secLang">Language</span></h3>
      <div class="seg" id="langSeg"></div>
    </section>

    <section class="msec">
      <h3 class="msec-title"><svg class="i"><use href="#i-users"/></svg><span data-i18n="secFamily">Family</span></h3>
      <p class="msec-hint" data-i18n="familyHint"></p>
      <input class="inp" id="famInp" data-i18n-ph="familyPh" maxlength="30" autocomplete="off" style="margin-bottom:10px">

    <section class="msec">
      <h3 class="msec-title"><svg class="i"><use href="#i-lock"/></svg><span data-i18n="secSecurity">Security</span></h3>

      <div class="row2">
        <input class="inp pin-inp" id="pinCurrentInp" type="password" data-i18n-ph="pinCurrent" maxlength="4" inputmode="numeric" autocomplete="off">
        <input class="inp pin-inp" id="pinNewInp" type="password" data-i18n-ph="pinNew" maxlength="4" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn btn-pr btn-block" id="btnChangePin" type="button" data-i18n="changePin">Change PIN</button>
      <div class="status" id="pinChangeStatus"></div>

    <section class="msec">
      <h3 class="msec-title"><svg class="i"><use href="#i-key"/></svg><span data-i18n="secAi">AI settings</span></h3>
      <p class="msec-hint" data-i18n="aiHint"></p>
      <div class="seg seg3" id="provSeg"></div>
      <p class="msec-hint" id="keyWhere" style="margin:10px 0"></p>
      <input class="inp mono" id="apiKeyInp" type="password" placeholder="sk-ant-…" autocomplete="off" style="margin-bottom:10px">
      <button class="btn btn-gn btn-block" id="btnSaveKey" type="button" data-i18n="saveKey">Save API key</button>
      <div class="status" id="keyStatus"></div>
    </section>

    <div class="menu-foot" id="menuVer"></div>
  </div>
</div>

<!-- CONFIRM -->

  <div class="handle"></div>
  <div class="sh-body cf">
    <div class="sh-title" id="cfTitle"></div>
    <p id="cfText"></p>
    <div class="cf-btns">
      <button class="btn btn-ghost" id="cfCancel" type="button" data-i18n="cancel">Cancel</button>
      <button class="btn btn-pr" id="cfOk" type="button"></button>
    </div>
  </div>
</div>

<!-- LOCK SCREEN -->

  <div class="lock-inner">
    <img class="lock-chef" src="img/chef-wave-512.webp" alt="">
    <div class="lock-title">Meal Planner</div>

    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>

    <div class="keypad">
      <button class="pin-key" type="button" data-v="1">1</button>

      <button class="pin-key" type="button" data-v="3">3</button>

      <button class="pin-key" type="button" data-v="5">5</button>
      <button class="pin-key" type="button" data-v="6">6</button>
      <button class="pin-key" type="button" data-v="7">7</button>
      <button class="pin-key" type="button" data-v="8">8</button>
      <button class="pin-key" type="button" data-v="9">9</button>
      <button class="pin-key" type="button" data-v="del" data-i18n-aria="pinDelete"><svg class="i"><use href="#i-backspace"/></svg></button>
      <button class="pin-key" type="button" data-v="0">0</button>
      <button class="pin-key ok" type="button" data-v="ok">OK</button>
    </div>
    <div class="lock-foot" id="lockFoot"></div>
  </div>
</div>

<!-- THINKING CHEF -->
<div class="overlay-center" id="busy" role="status" aria-live="polite">
  <div class="pop-card">
    <div class="chef-wrap">
      <img src="img/chef-thinking-512.webp" alt="">
      <svg class="spark s1"><use href="#i-star"/></svg>
      <svg class="spark s2"><use href="#i-star"/></svg>
      <svg class="spark s3"><use href="#i-star"/></svg>
    </div>
    <div class="pop-text" id="busyText"></div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- HAPPY CHEF -->
<div class="overlay-center" id="celebrate" role="status" aria-live="polite">

function detectLang() {
  try { var s = localStorage.getItem('mp_lang'); if (LANGS.indexOf(s) !== -1) return s; } catch(e) {}
  var n = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS.indexOf(n) !== -1 ? n : 'en';
}
var lang = detectLang();

function t(key, vars) {
  var s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if (vars) Object.keys(vars).forEach(function(k){ s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}

// ── DOM HELPERS ──
var SVGNS = 'http://www.w3.org/2000/svg';
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function icon(name) {
  var s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', 'i');
  s.setAttribute('aria-hidden', 'true');
  var u = document.createElementNS(SVGNS, 'use');
  u.setAttribute('href', '#i-' + name);
  u.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#i-' + name);
  s.appendChild(u);
  return s;
}
function mealChip(k) {
  var c = el('span', 'mchip mchip-' + k);
  c.appendChild(icon(MEAL_ICON[k]));
  return c;
}
function iconBtn(name, label, cls) {
  var b = el('button', 'icon-btn sm' + (cls ? ' ' + cls : ''));
  b.type = 'button';
  b.setAttribute('aria-label', label);
  b.appendChild(icon(name));
  return b;
}

var aiSug = null;          // {off: week offset, days: [{breakfast,lunch,dinner} x7]}
var curStore = 'delhaize';
var mPhotoRef = null;      // stored photo of the meal being edited (before any change)
var mPhotoChanged = false; // true once a new photo is picked in the editor
var meToken = 0;           // guards async photo loads against a re-opened editor
var locked = true;

function defD() {
  return {days:{}, shop:{delhaize:[],lidl:[],aldi:[],massen:[],other:[]}, done:{}};
}
var D;
try {
  var saved = localStorage.getItem('mptandt');
  D = saved ? JSON.parse(saved) : defD();
} catch(e) {
  D = defD();
}
if (!D.days) D.days = {};
if (!D.shop) D.shop = defD().shop;
STORES.forEach(function(s){ if (!D.shop[s]) D.shop[s] = []; });
if (!D.done) D.done = {};

// Returns false (and warns) when the save fails, e.g. storage full
function sv() {
  try {
    localStorage.setItem('mptandt', JSON.stringify(D));
    return true;
  } catch(e) {
    toast(t('storageFull'));
    return false;
  }
}

// Ticks are keyed by store + item name, so deleting or reordering items never moves a tick
function doneKey(store, item) { return store + '|' + item; }

// One-time migration from old position-based keys ('lidl_3') to name-based keys ('lidl|Milk')
(function migrateDone() {
  var changed = false;

    var m = k.match(/^([a-z]+)_(\d+)$/);
    if (!m || STORES.indexOf(m[1]) === -1) return;
    var item = (D.shop[m[1]] || [])[+m[2]];
    if (item !== undefined && D.done[k]) D.done[doneKey(m[1], item)] = true;
    delete D.done[k];
    changed = true;
  });

})();

// ── PHOTO STORAGE (IndexedDB) ──
// Photos live in IndexedDB (hundreds of MB) instead of localStorage (~5 MB).
// A meal's photo field holds 'idb:<id>'; a plain data URL is still accepted (old data / fallback).
var PHOTO_REF = 'idb:';
var photoDbP = null;
function photoDb() {
  if (!photoDbP) {
    photoDbP = new Promise(function(resolve, reject) {
      if (!window.indexedDB) { reject(new Error('NO_IDB')); return; }
      var req = indexedDB.open('mptandt_photos', 1);
      req.onupgradeneeded = function() { req.result.createObjectStore('photos'); };
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
    photoDbP.catch(function() { photoDbP = null; });
  }
  return photoDbP;
}
function photoTx(mode, fn) {
  return photoDb().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction('photos', mode);
      var req = fn(tx.objectStore('photos'));
      tx.oncomplete = function() { resolve(req.result); };
      tx.onerror = function() { reject(tx.error); };
      tx.onabort = function() { reject(tx.error); };
    });
  });
}
function photoPut(id, dataUrl) { return photoTx('readwrite', function(s){ return s.put(dataUrl, id); }); }
function photoGet(id) { return photoTx('readonly', function(s){ return s.get(id); }); }
function photoDel(id) { return photoTx('readwrite', function(s){ return s.delete(id); }); }

function isPhotoRef(p) { return typeof p === 'string' && p.indexOf(PHOTO_REF) === 0; }
function newPhotoId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// Resolves to a displayable data URL (or null)
function photoSrc(p) {
  if (!p) return Promise.resolve(null);
  if (!isPhotoRef(p)) return Promise.resolve(p);
  return photoGet(p.slice(PHOTO_REF.length)).then(function(v){ return v || null; }, function(){ return null; });
}
// Stores a data URL, resolves to its ref; falls back to the data URL itself if IndexedDB is unavailable
function storePhoto(dataUrl) {
  var id = newPhotoId();
  return photoPut(id, dataUrl).then(function(){ return PHOTO_REF + id; }, function(){ return dataUrl; });
}
function dropPhoto(p) {
  if (isPhotoRef(p)) photoDel(p.slice(PHOTO_REF.length)).catch(function(){});
}

// Moves any photos still embedded in the data (old versions, old export files) into IndexedDB
function migratePhotos() {
  var jobs = [];
  Object.keys(D.days).forEach(function(k) {
    var meals = (D.days[k] && D.days[k].meals) || {};
    Object.keys(meals).forEach(function(mt) {
      var ml = meals[mt];
      if (!ml || !ml.photo || isPhotoRef(ml.photo)) return;
      var data = ml.photo;
      jobs.push(storePhoto(data).then(function(ref) {
        if (ml.photo === data && isPhotoRef(ref)) ml.photo = ref;
      }));
    });
  });
  if (!jobs.length) return Promise.resolve();
  return Promise.all(jobs).then(function(){ sv(); });
}

// ── DATES ──
function dk(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey() { return dk(new Date()); }
function wkDates(off) {
  var t0 = new Date(); t0.setHours(0,0,0,0);
  var dow = (t0.getDay() || 7) - 1;
  var mon = new Date(t0); mon.setDate(t0.getDate() - dow + off*7);
  var arr = [];
  for (var i=0; i<7; i++) { var d = new Date(mon); d.setDate(mon.getDate()+i); arr.push(d); }
  return arr;
}
function isoWeek(d) {
  var u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = u.getUTCDay() || 7;
  u.setUTCDate(u.getUTCDate() + 4 - day);
  var y0 = new Date(Date.UTC(u.getUTCFullYear(), 0, 1));
  return Math.ceil(((u - y0) / 86400000 + 1) / 7);
}
function fmt(d, opts) {
  try { return d.toLocaleDateString(LOCALES[lang], opts); } catch(e) { return d.toDateString(); }
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function dayName(d) { return cap(fmt(d, {weekday:'long'})); }

// ── PIN LOCK ──
// No PIN is built into the code: the first time the app opens on a phone, the user chooses one.
// Modes: 'enter' (a PIN exists), 'create' (choose a PIN), 'confirm' (type the new PIN again).
var pinEntry = '';
var pinMode = 'enter';
var pinFirst = '';
function getCorrectPin() {
  try { return localStorage.getItem('mp_pin') || null; } catch(e) { return null; }
}
function renderPinLabel() {
  $('pinLabel').textContent = t(pinMode === 'create' ? 'pinCreate' : pinMode === 'confirm' ? 'pinConfirm' : 'pinEnter');
}
function pinError(msg) {
  $('pinError').textContent = msg;
  var dots = $('pinDots');
  dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
  pinEntry = '';
  updatePinDots();
  setTimeout(function(){ $('pinError').textContent = ''; }, 2200);
}
function updatePinDots() {
  var dots = $('pinDots').children;
  for (var i=0; i<dots.length; i++) dots[i].className = i < pinEntry.length ? 'on' : '';
}
function unlock() {
  locked = false;
  $('pinScreen').hidden = true;
  try { sessionStorage.setItem('mp_auth','1'); } catch(e) {}
}
function checkPin() {
  if (pinMode === 'enter') {
    if (pinEntry === getCorrectPin()) unlock(); else pinError(t('pinWrong'));
    return;
  }
  if (pinEntry.length !== 4) return;
  if (pinMode === 'create') {
    pinFirst = pinEntry;
    pinEntry = '';
    pinMode = 'confirm';
    updatePinDots();
    renderPinLabel();
    return;
  }
  // confirm
  if (pinEntry !== pinFirst) {
    pinMode = 'create';
    pinFirst = '';
    renderPinLabel();
    pinError(t('pinMismatch'));
    return;
  }
  try { localStorage.setItem('mp_pin', pinEntry); } catch(e) {}
  pinMode = 'enter';
  unlock();
  toast(t('pinCreated'));
}
function pressPin(v) {
  if (v === 'del') pinEntry = pinEntry.slice(0, -1);
  else if (v === 'ok') { checkPin(); return; }
  else if (pinEntry.length < 4) pinEntry += v;
  updatePinDots();
  if (pinEntry.length === 4 && v !== 'del') checkPin();
}
function initPin() {
  var authed = false;
  try { authed = sessionStorage.getItem('mp_auth') === '1'; } catch(e) {}
  if (authed && getCorrectPin()) { unlock(); return; }
  pinMode = getCorrectPin() ? 'enter' : 'create';
  renderPinLabel();
  document.querySelectorAll('.pin-key').forEach(function(btn) {
    btn.addEventListener('click', function(){ pressPin(btn.getAttribute('data-v')); });
  });
}

function handleMealPhoto(e) {

function identifyInEditor() {

    })
    .catch(function(e) { toast(e.message === 'NO_KEY' ? t('noKey') : t('identifyFail')); })
    .finally(hideBusy);

function saveMeal() {
  var name = $('mName').value.trim();
  if (!name) { toast(t('enterName')); $('mName').focus(); return; }
  if (!selDate || !editMT) return;
  var key = dk(selDate);
  var mt = editMT;
  var notes = $('mNotes').value.trim();
  var oldRef = mPhotoRef;
  var changed = mPhotoChanged;
  var btn = $('btnSaveMeal');
  btn.disabled = true;
  var photoP = (changed && mPhoto) ? storePhoto(mPhoto) : Promise.resolve(oldRef);
  photoP.then(function(photo) {
    if (!D.days[key]) D.days[key] = {meals:{}, isQuick:false};
    if (!D.days[key].meals) D.days[key].meals = {};
    var before = D.days[key].meals[mt];
    D.days[key].meals[mt] = { name: name, notes: notes, photo: photo || null };
    if (!sv()) {
      // Not saved: undo in memory and discard the new photo, keep the editor open
      if (before) D.days[key].meals[mt] = before; else delete D.days[key].meals[mt];
      if (changed) dropPhoto(photo);
      return;
    }
    if (changed && oldRef && oldRef !== photo) dropPhoto(oldRef);
    closeSh('mealSheet');
    renderSlots();
    renderWk();
    toast(t('saved', {name: name}));
  }).catch(function(e) {
    toast(t('saveError', {msg: e.message}));
  }).finally(function() {
    btn.disabled = false;
  });
}

var SHOP_SCHEMA = {
  type: 'object',
  properties: {
    delhaize: {type:'array', items:{type:'string'}},
    lidl: {type:'array', items:{type:'string'}},
    aldi: {type:'array', items:{type:'string'}},
    massen: {type:'array', items:{type:'string'}},
    other: {type:'array', items:{type:'string'}}
  },
  required: ['delhaize','lidl','aldi','massen','other'],
  additionalProperties: false
};

// Where the family buys what — shared by the week list and the ingredients of one dish
function storeRules() {
  return 'Put fresh produce, meat and dairy under delhaize; dry goods, tins and drinks under aldi or lidl; ' +
    'use massen only for special or bulk items; anything else under other. Leave a store empty when nothing fits. ' +
    'Keep each item short with an approximate quantity, and write every item in ' + LANG_AI[lang] + '.';
}

// Adds AI items to the store lists, skipping ones already listed.
// Returns how many were added, or -1 when saving failed (lists are then left unchanged).
function mergeShop(res) {
  var before = JSON.stringify(D.shop);
  var added = 0;
  STORES.forEach(function(s) {
    if (!Array.isArray(res[s])) return;
    res[s].forEach(function(item) {
      item = String(item).trim();
      if (item && D.shop[s].indexOf(item) === -1) { D.shop[s].push(item); added++; }
    });
  });
  if (!sv()) { D.shop = JSON.parse(before); return -1; }
  renderShop();
  return added;
}

function aiShop() {
  var meals = weekMealsText(wkOff);
  if (!meals) { toast(t('noMealsWeek')); return; }
  showBusy(t('generating'));
  callAI(
    'Write a shopping list for this week\'s family meals (2 adults and children, living in the Belgian Ardennes, shopping at Delhaize, Lidl, Aldi and Massen in Luxembourg).\n\n' +
    'Meals:\n' + meals + '\n' + storeRules(),
    SHOP_SCHEMA
  ).then(function(res) {
    if (mergeShop(res) >= 0) celebrate(t('shopUpdated'));
  }).catch(function(e) {
    toast(aiErrMsg(e));
  }).finally(hideBusy);
}

// The dish recognised from a photo → its ingredients on the shopping lists
function addIngredients() {
  if (!idDish) return;

// ── API ──
function getProvider() {
  try { var p = localStorage.getItem('mp_provider'); if (PROVIDERS[p]) return p; } catch(e) {}
  return 'claude';
}
var provider = getProvider();
function getApiKey(p) {
  try { return localStorage.getItem(PROVIDERS[p || provider].keyStore) || ''; } catch(e) { return ''; }
}

// One AI request with a JSON-schema answer format, sent to the service chosen in the menu.
// prompt: text; schema: JSON schema of the answer; image: optional data URL of a photo.
function callAI(prompt, schema, image) {
  var key = getApiKey();
  if (!key) return Promise.reject(new Error('NO_KEY'));
  return provider === 'claude' ? callClaude(key, prompt, schema, image)
                               : callResponses(PROVIDERS[provider], key, prompt, schema, image);
}

function postJson(url, headers, body) {
  return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
    .then(function(res) {
      return res.json().then(function(data){ return {status: res.status, data: data || {}}; },
                            function(){ return {status: res.status, data: {}}; });
    });
}

// Turns an HTTP error into one of the app's error codes (see aiErrMsg)
function apiError(r) {
  var e = r.data && r.data.error;
  var msg = (typeof e === 'string' ? e : (e && e.message)) || r.data.message || ('HTTP ' + r.status);
  if (r.status === 401 || r.status === 403 || /api[ _-]?key/i.test(msg)) return new Error('BAD_KEY');
  if (/credit|quota|balance|billing/i.test(msg)) return new Error('NO_CREDIT');
  return new Error(msg);
}

// Claude: Anthropic Messages API. Uses server-side refusal fallbacks;
// if the server rejects that option, retries once without it.
function callClaude(key, prompt, schema, image) {
  var content = prompt;
  if (image) {
    content = [
      {type:'image', source:{type:'base64', media_type:(image.match(/data:([^;]+);/) || [])[1] || 'image/jpeg', data:image.split(',')[1]}},
      {type:'text', text:prompt}
    ];
  }
  function send(withFallback) {
    var headers = {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
    var body = {
      model: PROVIDERS.claude.model,
      max_tokens: 16000,
      output_config: { effort: 'low', format: { type: 'json_schema', schema: schema } },
      messages: [{ role: 'user', content: content }]
    };
    if (withFallback) {
      headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
      body.fallbacks = 'default';
    }
    return postJson(CLAUDE_URL, headers, body);
  }
  return send(true).then(function(r) {
    if (r.status === 400 && r.data.error && r.data.error.type === 'invalid_request_error' &&
        !/credit|balance/i.test(r.data.error.message || '')) return send(false);
    return r;
  }).then(function(r) {
    var data = r.data;
    if (r.status >= 400 || data.error) throw apiError(r);
    if (data.stop_reason === 'refusal') throw new Error('REFUSED');
    var txt = (data.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
    try { return JSON.parse(txt); } catch(e) { throw new Error('BAD'); }
  });
}

// ChatGPT (OpenAI) and Grok (xAI): Responses API, same request and answer format on both.
// store:false — the service does not keep the conversation.
function callResponses(p, key, prompt, schema, image) {
  var content = [{type:'input_text', text:prompt}];
  if (image) content.unshift({type:'input_image', image_url:image});
  var body = {
    model: p.model,
    store: false,
    input: [{ role: 'user', content: content }],
    text: { format: { type: 'json_schema', name: 'answer', schema: schema, strict: true } }
  };
  return postJson(p.url, { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body)
    .then(function(r) {
      var data = r.data;
      if (r.status >= 400 || data.error) throw apiError(r);
      var txt = typeof data.output_text === 'string' ? data.output_text : '';
      var refused = false;
      (data.output || []).forEach(function(item) {
        (item.content || []).forEach(function(c) {
          if (c.type === 'output_text' && typeof data.output_text !== 'string') txt += c.text;
          if (c.type === 'refusal') refused = true;
        });
      });
      if (!txt && refused) throw new Error('REFUSED');
      try { return JSON.parse(txt); } catch(e) { throw new Error('BAD'); }
    });
}

function aiErrMsg(e) {
  switch (e && e.message) {
    case 'NO_KEY': return t('noKey');
    case 'BAD_KEY': return t('keyInvalid');
    case 'NO_CREDIT': return t('aiNoCredit');
    case 'REFUSED': return t('aiRefused');
    case 'BAD': return t('badResponse');
    default: return t('aiFail');
  }
}

function compress(file, maxPx, q) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var sc = Math.min(maxPx/img.width, maxPx/img.height, 1);
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', q));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── REPORT (kept in English: it is meant to be pasted into Claude) ──
function generateReport() {
  var lines = [];
  var now = new Date().toLocaleDateString('en-GB', {weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  lines.push('='.repeat(56));
  lines.push((familyName() ? 'FAMILY ' + familyName().toUpperCase() + ' — ' : '') + 'MEAL PLANNER REPORT');
  lines.push('Generated: ' + now);
  lines.push('='.repeat(56));

  var dayKeys = Object.keys(D.days).sort();
  lines.push('\nMEAL HISTORY (' + dayKeys.length + ' days logged)');
  lines.push('-'.repeat(40));
  if (dayKeys.length === 0) {
    lines.push('No meals logged yet.');
  } else {
    dayKeys.forEach(function(key) {
      var dd = D.days[key];
      var meals = dd.meals || {};
      lines.push('\n' + key + (dd.isQuick ? ' [QUICK DAY]' : ''));
      MT.forEach(function(m) {
        var ml = meals[m.k];
        var label = I18N.en[m.k];
        lines.push('  ' + label + ': ' + (ml ? ml.name + (ml.notes ? ' — ' + ml.notes : '') : '(not logged)'));
      });
    });
  }

  lines.push('\n' + '='.repeat(56));
  lines.push('MEAL FREQUENCY (most cooked)');
  lines.push('-'.repeat(40));
  var freq = {};
  dayKeys.forEach(function(key) {
    var meals = (D.days[key] && D.days[key].meals) || {};
    MT.forEach(function(m) {
      if (meals[m.k] && meals[m.k].name) {
        var name = meals[m.k].name.trim().toLowerCase();
        freq[name] = (freq[name] || 0) + 1;
      }
    });
  });
  var sorted = Object.keys(freq).sort(function(a,b){ return freq[b] - freq[a]; });
  if (sorted.length === 0) lines.push('No data yet.');
  else sorted.slice(0, 20).forEach(function(name){ lines.push('  ' + freq[name] + 'x  ' + name); });

  var quickDays = dayKeys.filter(function(k){ return D.days[k] && D.days[k].isQuick; });
  if (quickDays.length > 0) {
    lines.push('\n' + '='.repeat(56));
    lines.push('BUSY / QUICK DAYS (' + quickDays.length + ' logged)');
    lines.push('-'.repeat(40));
    var dowCount = [0,0,0,0,0,0,0];
    quickDays.forEach(function(k){ var p = k.split('-'); dowCount[new Date(+p[0], +p[1]-1, +p[2]).getDay()]++; });
    var dowNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    dowCount.forEach(function(n, d){ if (n > 0) lines.push('  ' + dowNames[d] + ': ' + n + 'x'); });
  }

  lines.push('\n' + '='.repeat(56));
  lines.push('CURRENT SHOPPING LISTS');
  lines.push('-'.repeat(40));
  STORES.forEach(function(s) {
    var items = D.shop[s] || [];
    if (items.length > 0) {
      lines.push('\n' + STORE_NAMES[s]);
      items.forEach(function(item){ lines.push('  • ' + item); });
    }
  });

  lines.push('\n' + '='.repeat(56));
  lines.push('END OF REPORT');
  lines.push('Paste this into Claude and say: "Here is our meal data, please analyse and improve the app"');
  lines.push('='.repeat(56));

  download(lines.join('\n'), 'text/plain', fileSlug() + '-meal-report-' + new Date().toISOString().split('T')[0] + '.txt');
  toast(t('reportDone'));
}

function download(text, type, name) {
  var url = URL.createObjectURL(new Blob([text], {type: type}));
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

// Export bundles the photos from IndexedDB, so the file is a complete backup
function exportData() {
  var ids = [];
  Object.keys(D.days).forEach(function(k) {
    var meals = (D.days[k] && D.days[k].meals) || {};
    Object.keys(meals).forEach(function(mt) {
      if (meals[mt] && isPhotoRef(meals[mt].photo)) ids.push(meals[mt].photo.slice(PHOTO_REF.length));
    });
  });
  toast(t('exporting'));
  Promise.all(ids.map(function(id) {
    return photoGet(id).then(function(v){ return [id, v]; }, function(){ return [id, null]; });
  })).then(function(pairs) {
    var photos = {};
    pairs.forEach(function(p){ if (p[1]) photos[p[0]] = p[1]; });
    var payload = { version: APP_VERSION, exported: new Date().toISOString(), family: familyName(), data: D, photos: photos };
    download(JSON.stringify(payload, null, 2), 'application/json', fileSlug() + '-meal-data-' + new Date().toISOString().split('T')[0] + '.json');
    toast(t('exported'));
  });
}

function importData(e) {
  var f = e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var payload, incoming;
    try {
      payload = JSON.parse(ev.target.result);
      incoming = payload.data || payload;
    } catch(err) {
      toast(t('importFail'));
      e.target.value = '';
      return;
    }
    e.target.value = '';
    var photos = payload.photos || {};
    // Store bundled photos first; remember any that could not be stored
    Promise.all(Object.keys(photos).map(function(id) {
      return photoPut(id, photos[id]).then(function(){ return null; }, function(){ return id; });
    })).then(function(failedIds) {
      var failed = {};
      failedIds.forEach(function(id){ if (id) failed[id] = true; });
      // Merge: keep local data, add incoming on top
      if (incoming.days) {
        Object.keys(incoming.days).forEach(function(k) {
          var meals = (incoming.days[k] && incoming.days[k].meals) || {};
          Object.keys(meals).forEach(function(mt) {
            var ml = meals[mt];
            if (ml && isPhotoRef(ml.photo)) {
              var id = ml.photo.slice(PHOTO_REF.length);
              if (failed[id]) ml.photo = photos[id]; // keep it inline rather than lose it
            }
          });
          D.days[k] = incoming.days[k];
        });
      }
      if (incoming.shop) {
        STORES.forEach(function(s) {
          if (incoming.shop[s]) {
            var ex = new Set(D.shop[s] || []);
            incoming.shop[s].forEach(function(item){ ex.add(item); });
            D.shop[s] = Array.from(ex);
          }
        });
      }
      if (incoming.family) D.family = incoming.family;
      return migratePhotos(); // older export files carry photos inline
    }).then(function() {
      if (!sv()) return;
      applyFamily();
      renderWk();
      renderShop();
      toast(t('imported'));
    }).catch(function() {
      toast(t('importFail'));
    });
  };
  reader.readAsText(f);
}

$('btnChangePin').addEventListener('click', function() {
  var current = $('pinCurrentInp').value.trim();
  var newPin = $('pinNewInp').value.trim();
  if (current !== getCorrectPin()) { setStatus('pinChangeStatus', t('pinWrongCurrent'), 'err'); return; }
  if (!/^\d{4}$/.test(newPin)) { setStatus('pinChangeStatus', t('pinFormat'), 'err'); return; }
  try {
    localStorage.setItem('mp_pin', newPin);
    $('pinCurrentInp').value = '';
    $('pinNewInp').value = '';
    setStatus('pinChangeStatus', t('pinChanged'), 'ok');
  } catch(e) {
    setStatus('pinChangeStatus', t('storageFull'), 'err');
  }
});

$('btnSaveKey').addEventListener('click', function() {
  var val = $('apiKeyInp').value.trim();
  if (!val) { toast(t('keyEmpty')); return; }
  try {
    localStorage.setItem(PROVIDERS[provider].keyStore, val);
    $('apiKeyInp').value = '';
    updateKeyStatus();
    toast(t('keySaved'));
  } catch(e) {
    toast(t('storageFull'));
  }
});

$('celebrate').addEventListener('click', function(){ $('celebrate').classList.remove('on'); });

document.addEventListener('keydown', function(e) {
  if (locked) {
    if (/^[0-9]$/.test(e.key)) pressPin(e.key);
    else if (e.key === 'Backspace') pressPin('del');
    else if (e.key === 'Enter') pressPin('ok');
    return;
  }
  if (e.key === 'Escape') closeTop();
});

// ── INIT ──
window.onerror = function(msg, src, line) {
  var b = $('err-banner');
  b.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
  b.hidden = false;
  return false;
};
$('js-banner').hidden = true;
applyLang();
initPin();
// Ask the browser not to clear our storage when the phone runs low on space
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
migratePhotos();

})();
</script>
</body>
</html>
