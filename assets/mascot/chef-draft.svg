<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Meal Planner chef mascot">
  <title>Meal Planner chef mascot</title>
  <!-- Palette: terracotta #C4622D, green #2C5F2E, amber #D4900A, cream #FEF8F0, outline #3A2E25 -->
  <g stroke="#3A2E25" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Ground shadow -->
    <ellipse cx="100" cy="209" rx="52" ry="7" fill="#3A2E25" opacity=".12" stroke="none"/>

    <!-- Wooden spoon (behind right hand) -->
    <path d="M166 150 L176 104" stroke-width="10" fill="none"/>
    <path d="M166 150 L176 104" stroke="#C98B4B" stroke-width="4" fill="none"/>
    <ellipse cx="178" cy="92" rx="10" ry="14" fill="#C98B4B" transform="rotate(12 178 92)"/>
    <ellipse cx="179" cy="90" rx="4" ry="7" fill="#E0AE76" stroke="none" transform="rotate(12 179 90)"/>

    <!-- Right arm (raised) -->
    <path d="M134 166 L160 146" stroke-width="18" fill="none"/>
    <path d="M134 166 L160 146" stroke="#FFFFFF" stroke-width="10" fill="none"/>

    <!-- Body: chef jacket -->
    <path d="M58 206 Q56 152 100 148 Q144 152 142 206 Z" fill="#FFFFFF"/>
    <path d="M100 168 L100 204" stroke="#EDE0CC" stroke-width="3" fill="none"/>
    <circle cx="90" cy="178" r="3.5" fill="#C4622D" stroke="none"/>
    <circle cx="110" cy="178" r="3.5" fill="#C4622D" stroke="none"/>
    <circle cx="90" cy="194" r="3.5" fill="#C4622D" stroke="none"/>
    <circle cx="110" cy="194" r="3.5" fill="#C4622D" stroke="none"/>

    <!-- Left arm resting on the tummy -->
    <path d="M66 166 Q66 186 88 188" stroke-width="18" fill="none"/>
    <path d="M66 166 Q66 186 88 188" stroke="#FFFFFF" stroke-width="10" fill="none"/>

    <!-- Hands -->
    <circle cx="92" cy="187" r="9" fill="#F6C9A0"/>
    <circle cx="164" cy="143" r="9" fill="#F6C9A0"/>

    <!-- Neckerchief (tucked under the head) -->
    <path d="M78 146 L122 146 L100 170 Z" fill="#C4622D"/>

    <!-- Ears -->
    <circle cx="55" cy="108" r="9" fill="#F6C9A0"/>
    <circle cx="145" cy="108" r="9" fill="#F6C9A0"/>

    <!-- Head -->
    <circle cx="100" cy="106" r="45" fill="#F6C9A0"/>

    <!-- Toque: outlined puffs first, then fills on top so inner lines disappear -->
    <circle cx="70" cy="50" r="20" fill="#FFFFFF"/>
    <circle cx="100" cy="38" r="26" fill="#FFFFFF"/>
    <circle cx="130" cy="50" r="20" fill="#FFFFFF"/>
    <g stroke="none" fill="#FFFFFF">
      <circle cx="70" cy="50" r="18"/>
      <circle cx="100" cy="38" r="24"/>
      <circle cx="130" cy="50" r="18"/>
      <rect x="70" y="44" width="60" height="22"/>
    </g>
    <path d="M86 30 Q92 24 100 26" stroke="#EDE0CC" stroke-width="3" fill="none"/>
    <rect x="62" y="60" width="76" height="20" rx="6" fill="#FFFFFF"/>
    <path d="M78 66 L78 76 M100 66 L100 76 M122 66 L122 76" stroke="#EDE0CC" stroke-width="3" fill="none"/>

    <!-- Eyebrows -->
    <path d="M78 94 Q84 90 90 93" fill="none" stroke-width="3"/>
    <path d="M110 93 Q116 90 122 94" fill="none" stroke-width="3"/>

    <!-- Eyes -->
    <ellipse cx="84" cy="106" rx="5" ry="7" fill="#3A2E25" stroke="none"/>
    <ellipse cx="116" cy="106" rx="5" ry="7" fill="#3A2E25" stroke="none"/>
    <circle cx="86" cy="103" r="2" fill="#FFFFFF" stroke="none"/>
    <circle cx="118" cy="103" r="2" fill="#FFFFFF" stroke="none"/>

    <!-- Cheeks -->
    <ellipse cx="72" cy="122" rx="8" ry="5" fill="#E8896A" opacity=".55" stroke="none"/>
    <ellipse cx="128" cy="122" rx="8" ry="5" fill="#E8896A" opacity=".55" stroke="none"/>

    <!-- Smile -->
    <path d="M87 122 Q100 138 113 122 Z" fill="#8B3A1E" stroke-width="3"/>
    <path d="M94 129 Q100 133 106 129" fill="#E8896A" stroke="none"/>
  </g>
</svg>
